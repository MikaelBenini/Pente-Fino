name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache do Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-

      - run: pnpm install --frozen-lockfile

      - name: Nenhum segredo no repositório (.env só o de exemplo)
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "Arquivo .env no repositório: segredos ficam nos Secrets do GitHub ou no servidor." >&2
            exit 1
          fi

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Cobertura mínima de 80% nas regras de cálculo
        run: pnpm --filter @pente-fino/shared test:cobertura
      - run: pnpm build

  banco:
    name: Banco, API e telas (migrações, seed, RLS e e2e)
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache do Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-

      - run: pnpm install --frozen-lockfile

      - name: Criar .env a partir do modelo
        run: cp .env.example .env

      - name: Subir PostgreSQL e Redis
        run: docker compose --env-file .env -f infra/docker-compose.dev.yml up -d --wait --wait-timeout 120 postgres redis

      - name: Compilar API, telas e pacotes
        run: pnpm turbo run build --filter=@pente-fino/api --filter=@pente-fino/web

      - name: Migrações batem com o schema.prisma (reaplicadas no banco sombra)
        working-directory: packages/db
        run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Aplicar migrações como o dono do banco
        run: pnpm db:deploy

      - name: Seed de demonstração (duas vezes, para testar a recriação)
        run: pnpm db:seed && pnpm db:seed

      - name: Testes de isolamento por conta e regras do banco
        run: pnpm test:db

      - name: Testes de ponta a ponta da API (login, convite, senha)
        run: pnpm test:e2e

      - name: Teste de carga (agenda e indicadores com o seed)
        run: |
          (cd apps/api && API_PORT=3201 LOG_LEVEL=warn LIMITE_POR_MINUTO=100000 node dist/main.js &) 
          for i in $(seq 1 60); do curl -sf http://localhost:3201/health >/dev/null && break; sleep 1; done
          CARGA_API=http://localhost:3201 pnpm carga

      - name: Instalar o Chromium do Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Telas no navegador (menu por papel, no computador e no celular)
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: apps/web/test-results
          retention-days: 7

      - name: Logs em caso de falha
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.dev.yml logs --no-color --tail 200 postgres redis
