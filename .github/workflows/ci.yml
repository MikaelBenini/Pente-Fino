name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  banco:
    name: Banco e API (migrações, seed, RLS e e2e)
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Criar .env a partir do modelo
        run: cp .env.example .env

      - name: Subir PostgreSQL e Redis
        run: docker compose --env-file .env -f infra/docker-compose.dev.yml up -d --wait --wait-timeout 120 postgres redis

      - name: Compilar os pacotes de que a API depende
        run: pnpm turbo run build --filter=@pente-fino/api^...

      - name: Migrações batem com o schema.prisma (reaplicadas no banco sombra)
        working-directory: packages/db
        run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Aplicar migrações como o dono do banco
        run: pnpm db:deploy

      - name: Seed de demonstração (duas vezes, para testar a recriação)
        run: pnpm db:seed && pnpm db:seed

      - name: Testes de isolamento por conta e regras do banco
        run: pnpm test:db

      - name: Testes de ponta a ponta da API (login, convite, senha)
        run: pnpm test:e2e

      - name: Logs em caso de falha
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.dev.yml logs --no-color --tail 200 postgres redis
