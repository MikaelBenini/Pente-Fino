name: Imagens

# A cada merge na main: constrói as imagens de produção e envia ao GitHub Container Registry
# com a tag do commit (e "latest"). O deploy (Etapa 16) puxa pela tag do commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    name: Imagem ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: api
            dockerfile: apps/api/Dockerfile
            alvo: final
          - nome: migracoes
            dockerfile: apps/api/Dockerfile
            alvo: migracoes
          - nome: worker
            dockerfile: apps/worker/Dockerfile
            alvo: final
          - nome: web
            dockerfile: apps/web/Dockerfile
            alvo: final
    steps:
      - uses: actions/checkout@v7

      - name: Nome da imagem (o registro exige minúsculas)
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pente-fino-${{ matrix.nome }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Entrar no GitHub Container Registry (token do próprio workflow, sem segredo guardado)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e enviar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.alvo }}
          push: true
          # Endereço público do site (sitemap, robots e prévia de link são montados no build).
          # Variável do repositório APP_URL; sem ela, o domínio de produção.
          build-args: |
            APP_URL=${{ vars.APP_URL || 'https://seupentefino.com.br' }}
          tags: |
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
            ${{ steps.nome.outputs.imagem }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

  # Deploy automático na VPS: a chave só roda infra/implantar.sh (ver infra/chave-deploy.sh).
  # Sem o secret DEPLOY_SSH_KEY, o passo só avisa e não falha.
  implantar:
    name: Implantar na VPS
    needs: imagem
    runs-on: ubuntu-latest
    environment: producao
    concurrency:
      group: implantar-producao
      cancel-in-progress: false
    steps:
      - name: Entrar por SSH e subir a versão
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          CONHECIDOS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$HOST" ] || [ -z "$CONHECIDOS" ]; then
            echo "::notice::Deploy automático desligado: falta DEPLOY_SSH_KEY, DEPLOY_HOST ou DEPLOY_KNOWN_HOSTS."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$CONHECIDOS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "deploy@$HOST" "${{ github.sha }}"
