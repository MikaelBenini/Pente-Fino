# Dependências desatualizadas ou com falha de segurança viram pull request (que passa pelo CI).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    ignore:
      # Os tipos seguem o Node da produção (24 LTS).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
  - package-ecosystem: docker
    directories: [/apps/api, /apps/worker, /apps/web]
    # Fica na versão LTS do Node (a mesma do .nvmrc); a troca de major é feita à mão.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
  # Imagens do compose de produção (Evolution API, PostgreSQL, Redis, Caddy, Uptime Kuma): a
  # Evolution corrige o WhatsApp com frequência; cada PR passa pelo CI antes de ir ao ar.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
