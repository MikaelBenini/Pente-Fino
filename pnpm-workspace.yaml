packages:
  - apps/*
  - packages/*

# Versões compartilhadas entre os pacotes: use "catalog:" no package.json.
catalog:
  '@types/node': ^24.0.0
  typescript: ^6.0.2
  vitest: ^4.1.2
  zod: ^4.0.0

# Pacotes que podem rodar scripts de instalação.
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
