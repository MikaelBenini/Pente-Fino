packages:
  - apps/*
  - packages/*

# Versões compartilhadas entre os pacotes: use "catalog:" no package.json.
catalog:
  '@types/node': ^26.6.6
  typescript: ^6.0.2
  vitest: ^5.1.0
  zod: ^4.0.0

# Pacotes que podem rodar scripts de instalação.
allowBuilds:
  # Telemetria do swagger-ui: negada.
  '@scarf/scarf': false
  '@nestjs/core': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
